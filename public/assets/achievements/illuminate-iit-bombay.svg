<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" fill="none">
  <defs>
    <linearGradient id="bg03" x1="0" y1="0" x2="480" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071331" />
      <stop offset="55%" stop-color="#040B1F" />
      <stop offset="100%" stop-color="#0D1940" />
    </linearGradient>
    <radialGradient id="beacon03" cx="28%" cy="58%" r="48%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.34" />
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#040B1F" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="prismBeam03" x1="130" y1="168" x2="430" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.42" />
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="curve03" x1="120" y1="210" x2="400" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="55%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <linearGradient id="rim03" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="55%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <pattern id="grid03" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" stroke="#60A5FA" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="480" height="300" fill="url(#bg03)" />
  <rect width="480" height="300" fill="url(#grid03)" />
  <rect width="480" height="300" fill="url(#beacon03)" />

  <!-- Radiant Prism Light Cone -->
  <polygon points="146,168 432,68 432,232" fill="url(#prismBeam03)" />

  <!-- Glowing Prism Beacon Emblem -->
  <g transform="translate(124, 168)">
    <circle cx="0" cy="0" r="64" stroke="#FBBF24" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4 5" />
    <circle cx="0" cy="0" r="44" stroke="#38BDF8" stroke-opacity="0.32" stroke-width="1.2" />
    <polygon points="0,-38 34,24 -34,24" fill="#09193D" fill-opacity="0.94" stroke="url(#rim03)" stroke-width="2" />
    <polygon points="0,-20 18,12 -18,12" fill="none" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1" />
    <line x1="0" y1="-16" x2="0" y2="12" stroke="#FDE68A" stroke-width="2" stroke-linecap="round" />
    <circle cx="0" cy="-2" r="5" fill="#FBBF24" />
  </g>

  <!-- Trajectory Curves & Glowing Geometric Milestones -->
  <path d="M148 208 C210 208, 240 156, 294 142 C340 130, 376 102, 412 82" stroke="url(#curve03)" stroke-width="2.8" stroke-linecap="round" />
  <path d="M148 224 C220 224, 258 182, 310 170 C356 158, 386 134, 422 114" stroke="#38BDF8" stroke-opacity="0.28" stroke-width="1.3" stroke-dasharray="4 4" />

  <!-- Pure Geometric Milestone Nodes (No Text) -->
  <g>
    <!-- Node 1: Ideation Ring -->
    <circle cx="212" cy="186" r="10" fill="#071330" stroke="#38BDF8" stroke-width="1.8" />
    <circle cx="212" cy="186" r="4" fill="#7DD3FC" />

    <!-- Node 2: Validation Diamond -->
    <circle cx="298" cy="140" r="12" fill="#071330" stroke="#60A5FA" stroke-width="1.8" />
    <polygon points="298,134 304,140 298,146 292,140" fill="#93C5FD" />

    <!-- Node 3: Golden Apex Venture Star -->
    <circle cx="388" cy="94" r="16" fill="#071330" stroke="#FBBF24" stroke-width="2" />
    <circle cx="388" cy="94" r="24" stroke="#FBBF24" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3 4" />
    <path d="M388 85L390.5 91.5L397 94L390.5 96.5L388 103L385.5 96.5L379 94L385.5 91.5Z" fill="#FDE68A" />
  </g>
</svg>
