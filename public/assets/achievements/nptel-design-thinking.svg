<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" fill="none">
  <defs>
    <linearGradient id="bg01" x1="0" y1="0" x2="480" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071330" />
      <stop offset="55%" stop-color="#040B1F" />
      <stop offset="100%" stop-color="#0B183C" />
    </linearGradient>
    <radialGradient id="glowCyan01" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="55%" stop-color="#2563EB" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#040B1F" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowGold01" cx="62%" cy="42%" r="36%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.24" />
      <stop offset="65%" stop-color="#F59E0B" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#040B1F" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="loopStroke01" x1="100" y1="90" x2="380" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <pattern id="grid01" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" stroke="#93C5FD" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Deep midnight navy dark glass backdrop -->
  <rect width="480" height="300" fill="url(#bg01)" />
  <rect width="480" height="300" fill="url(#grid01)" />
  <rect width="480" height="300" fill="url(#glowCyan01)" />
  <rect width="480" height="300" fill="url(#glowGold01)" />

  <!-- Centered Orbital Geometry & Iterative Design Thinking Constellation -->
  <g transform="translate(240, 150)">
    <!-- Concentric Orbital Rings -->
    <circle cx="0" cy="0" r="108" stroke="#38BDF8" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="4 6" />
    <circle cx="0" cy="0" r="78" stroke="#FBBF24" stroke-opacity="0.18" stroke-width="1" />
    <circle cx="0" cy="0" r="46" stroke="#60A5FA" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="2 4" />

    <!-- Subtle Orbital Accent Dots -->
    <circle cx="-108" cy="0" r="2.5" fill="#38BDF8" fill-opacity="0.6" />
    <circle cx="108" cy="0" r="2.5" fill="#FBBF24" fill-opacity="0.65" />
    <circle cx="0" cy="-78" r="2.5" fill="#60A5FA" fill-opacity="0.6" />
    <circle cx="0" cy="78" r="2.5" fill="#38BDF8" fill-opacity="0.55" />

    <!-- Double-Diamond Iterative Infinity Loop -->
    <path d="M-136 0 C-136 -48, -64 -48, 0 0 C64 48, 136 48, 136 0 C136 -48, 64 -48, 0 0 C-64 48, -136 48, -136 0 Z"
      stroke="url(#loopStroke01)" stroke-width="2.6" stroke-linecap="round" fill="#0B1B45" fill-opacity="0.32" />

    <!-- Left Node: Empathy Pulse -->
    <circle cx="-136" cy="0" r="16" fill="#071330" stroke="#38BDF8" stroke-width="1.8" />
    <circle cx="-136" cy="0" r="9" stroke="#7DD3FC" stroke-opacity="0.45" stroke-width="1" />
    <circle cx="-136" cy="0" r="4.5" fill="#7DD3FC" />

    <!-- Upper-Left Node: Framing Diamond -->
    <circle cx="-70" cy="-34" r="12" fill="#071330" stroke="#60A5FA" stroke-width="1.5" />
    <polygon points="-70,-40 -64,-34 -70,-28 -76,-34" fill="#93C5FD" />

    <!-- Lower-Left Node: Insight Relay -->
    <circle cx="-70" cy="34" r="10" fill="#071330" stroke="#38BDF8" stroke-opacity="0.8" stroke-width="1.3" />
    <circle cx="-70" cy="34" r="3.5" fill="#38BDF8" />

    <!-- Center Core: Ideation Starburst -->
    <circle cx="0" cy="0" r="22" fill="#081433" stroke="#FBBF24" stroke-width="2" />
    <circle cx="0" cy="0" r="15" stroke="#FDE68A" stroke-opacity="0.35" stroke-width="1" />
    <path d="M0 -11V11M-11 0H11M-7.5 -7.5L7.5 7.5M7.5 -7.5L-7.5 7.5" stroke="#FDE68A" stroke-width="1.6" stroke-linecap="round" />
    <circle cx="0" cy="0" r="5" fill="#FBBF24" />

    <!-- Upper-Right Node: Prototype Module -->
    <circle cx="70" cy="-34" r="12" fill="#071330" stroke="#38BDF8" stroke-width="1.5" />
    <rect x="66" y="-38" width="8" height="8" rx="1.8" fill="#7DD3FC" />

    <!-- Lower-Right Node: Refinement Loop -->
    <circle cx="70" cy="34" r="10" fill="#071330" stroke="#FBBF24" stroke-opacity="0.85" stroke-width="1.3" />
    <circle cx="70" cy="34" r="3.5" fill="#FBBF24" />

    <!-- Right Node: Validation Check Seal -->
    <circle cx="136" cy="0" r="16" fill="#071330" stroke="#FBBF24" stroke-width="1.8" />
    <circle cx="136" cy="0" r="9" stroke="#FDE68A" stroke-opacity="0.4" stroke-width="1" />
    <path d="M130 0.5L134 4.5L142 -4" stroke="#FDE68A" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
