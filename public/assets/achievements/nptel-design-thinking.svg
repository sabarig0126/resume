<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" fill="none">
  <defs>
    <linearGradient id="bg01" x1="0" y1="0" x2="480" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071B1B" />
      <stop offset="55%" stop-color="#051414" />
      <stop offset="100%" stop-color="#0B2525" />
    </linearGradient>
    <radialGradient id="glowPink01" cx="42%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#F05BEA" stop-opacity="0.24" />
      <stop offset="58%" stop-color="#F05BEA" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#051414" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowLime01" cx="64%" cy="44%" r="36%">
      <stop offset="0%" stop-color="#C8FF27" stop-opacity="0.2" />
      <stop offset="65%" stop-color="#C8FF27" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#051414" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="loopStroke01" x1="100" y1="90" x2="380" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F05BEA" />
      <stop offset="52%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#C8FF27" />
    </linearGradient>
    <pattern id="grid01" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Deep teal dark glass backdrop -->
  <rect width="480" height="300" fill="url(#bg01)" />
  <rect width="480" height="300" fill="url(#grid01)" />
  <rect width="480" height="300" fill="url(#glowPink01)" />
  <rect width="480" height="300" fill="url(#glowLime01)" />

  <!-- Centered Orbital Geometry & Iterative Design Thinking Constellation -->
  <g transform="translate(240, 150)">
    <!-- Concentric Orbital Rings -->
    <circle cx="0" cy="0" r="108" stroke="#F05BEA" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="4 6" />
    <circle cx="0" cy="0" r="78" stroke="#C8FF27" stroke-opacity="0.22" stroke-width="1" />
    <circle cx="0" cy="0" r="46" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="2 4" />

    <!-- Subtle Orbital Accent Dots -->
    <circle cx="-108" cy="0" r="2.5" fill="#F05BEA" fill-opacity="0.7" />
    <circle cx="108" cy="0" r="2.5" fill="#C8FF27" fill-opacity="0.75" />
    <circle cx="0" cy="-78" r="2.5" fill="#FFFFFF" fill-opacity="0.55" />
    <circle cx="0" cy="78" r="2.5" fill="#F05BEA" fill-opacity="0.6" />

    <!-- Double-Diamond Iterative Infinity Loop -->
    <path d="M-136 0 C-136 -48, -64 -48, 0 0 C64 48, 136 48, 136 0 C136 -48, 64 -48, 0 0 C-64 48, -136 48, -136 0 Z"
      stroke="url(#loopStroke01)" stroke-width="2.6" stroke-linecap="round" fill="#0A2323" fill-opacity="0.35" />

    <!-- Left Node: Empathy Pulse -->
    <circle cx="-136" cy="0" r="16" fill="#071B1B" stroke="#F05BEA" stroke-width="1.8" />
    <circle cx="-136" cy="0" r="9" stroke="#F05BEA" stroke-opacity="0.45" stroke-width="1" />
    <circle cx="-136" cy="0" r="4.5" fill="#F05BEA" />

    <!-- Upper-Left Node: Framing Diamond -->
    <circle cx="-70" cy="-34" r="12" fill="#071B1B" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5" />
    <polygon points="-70,-40 -64,-34 -70,-28 -76,-34" fill="#F05BEA" />

    <!-- Lower-Left Node: Insight Relay -->
    <circle cx="-70" cy="34" r="10" fill="#071B1B" stroke="#F05BEA" stroke-opacity="0.8" stroke-width="1.3" />
    <circle cx="-70" cy="34" r="3.5" fill="#FFFFFF" fill-opacity="0.85" />

    <!-- Center Core: Ideation Starburst -->
    <circle cx="0" cy="0" r="22" fill="#071B1B" stroke="#C8FF27" stroke-width="2" />
    <circle cx="0" cy="0" r="15" stroke="#C8FF27" stroke-opacity="0.35" stroke-width="1" />
    <path d="M0 -11V11M-11 0H11M-7.5 -7.5L7.5 7.5M7.5 -7.5L-7.5 7.5" stroke="#C8FF27" stroke-width="1.6" stroke-linecap="round" />
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" />

    <!-- Upper-Right Node: Prototype Module -->
    <circle cx="70" cy="-34" r="12" fill="#071B1B" stroke="#F05BEA" stroke-width="1.5" />
    <rect x="66" y="-38" width="8" height="8" rx="1.8" fill="#C8FF27" />

    <!-- Lower-Right Node: Refinement Loop -->
    <circle cx="70" cy="34" r="10" fill="#071B1B" stroke="#C8FF27" stroke-opacity="0.85" stroke-width="1.3" />
    <circle cx="70" cy="34" r="3.5" fill="#C8FF27" />

    <!-- Right Node: Validation Check Seal -->
    <circle cx="136" cy="0" r="16" fill="#071B1B" stroke="#C8FF27" stroke-width="1.8" />
    <circle cx="136" cy="0" r="9" stroke="#C8FF27" stroke-opacity="0.4" stroke-width="1" />
    <path d="M130 0.5L134 4.5L142 -4" stroke="#C8FF27" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
