    <path d="M-30 0 H14 M14 0 L42 -42 H178 M14 0 H178 M14 0 L42 42 H178 M178 -42 L202 0 M178 0 H202 M178 42 L202 0"
      stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.4" stroke-linecap="round" />

    <!-- Module 1: Top Cyan Bar -->
    <rect x="42" y="-56" width="136" height="28" rx="7" fill="#0A1B42" fill-opacity="0.9" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="1.2" />
    <circle cx="58" cy="-42" r="4.5" fill="#22D3EE" />
    <rect x="72" y="-45" width="64" height="6" rx="3" fill="#38BDF8" fill-opacity="0.42" />
    <rect x="142" y="-45" width="22" height="6" rx="3" fill="#22D3EE" fill-opacity="0.7" />

    <!-- Module 2: Center Royal Blue Bar -->
    <rect x="42" y="-14" width="136" height="28" rx="7" fill="#0A1B42" fill-opacity="0.9" stroke="#60A5FA" stroke-opacity="0.6" stroke-width="1.2" />
    <circle cx="58" cy="0" r="4.5" fill="#60A5FA" />
    <rect x="72" y="-3" width="46" height="6" rx="3" fill="#60A5FA" fill-opacity="0.5" />
    <rect x="124" y="-3" width="40" height="6" rx="3" fill="#93C5FD" fill-opacity="0.35" />

    <!-- Module 3: Bottom Gold Bar -->
    <rect x="42" y="28" width="136" height="28" rx="7" fill="#0A1B42" fill-opacity="0.9" stroke="#FBBF24" stroke-opacity="0.55" stroke-width="1.2" />
    <circle cx="58" cy="42" r="4.5" fill="#FBBF24" />
    <rect x="72" y="39" width="72" height="6" rx="3" fill="#FBBF24" fill-opacity="0.48" />
    <rect x="150" y="39" width="14" height="6" rx="3" fill="#FDE68A" fill-opacity="0.75" />

    <!-- Convergence Target Seal -->
    <circle cx="204" cy="0" r="11" fill="#081433" stroke="#FBBF24" stroke-width="1.6" />
    <circle cx="204" cy="0" r="4.5" fill="#FDE68A" />
