<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" fill="none">
  <defs>
    <linearGradient id="bg02" x1="0" y1="0" x2="480" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071B1B" />
      <stop offset="52%" stop-color="#051414" />
      <stop offset="100%" stop-color="#0B2525" />
    </linearGradient>
    <radialGradient id="glow02" cx="34%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#F05BEA" stop-opacity="0.24" />
      <stop offset="55%" stop-color="#F05BEA" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#051414" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lime02" cx="76%" cy="50%" r="36%">
      <stop offset="0%" stop-color="#C8FF27" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#051414" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rim02" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F05BEA" />
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#C8FF27" />
    </linearGradient>
    <pattern id="dots02" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#FFFFFF" fill-opacity="0.1" />
    </pattern>
  </defs>

  <rect width="480" height="300" fill="url(#bg02)" />
  <rect width="480" height="300" fill="url(#dots02)" />
  <rect width="480" height="300" fill="url(#glow02)" />
  <rect width="480" height="300" fill="url(#lime02)" />

  <!-- Centered Pure-Geometric Circuit Hexagon & Architecture Pipeline -->
  <g transform="translate(148, 150)">
    <!-- Orbital Rings -->
    <circle cx="0" cy="0" r="78" stroke="#F05BEA" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="6 5" />
    <path d="M-56 -48 A74 74 0 0 1 56 -48" stroke="#C8FF27" stroke-width="2" stroke-linecap="round" />
    <path d="M56 48 A74 74 0 0 1 -56 48" stroke="#F05BEA" stroke-width="2" stroke-linecap="round" />

    <!-- Dual Hexagonal Frame -->
    <polygon points="0,-54 47,-27 47,27 0,54 -47,27 -47,-27" fill="#0A2323" fill-opacity="0.92" stroke="url(#rim02)" stroke-width="2" />
    <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="#071B1B" fill-opacity="0.7" stroke="#F05BEA" stroke-opacity="0.45" stroke-width="1.2" />

    <!-- Precision Innovation Gear & Spark Core -->
    <circle cx="0" cy="0" r="16" stroke="#F05BEA" stroke-width="1.8" />
    <path d="M0 -22V-16M0 16V22M-22 0H-16M16 0H22M-15.5 -15.5L-11 -11M11 11L15.5 15.5M15.5 -15.5L11 -11M-11 11L-15.5 15.5" stroke="#FFFFFF" stroke-opacity="0.78" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="0" cy="0" r="6" fill="#C8FF27" />
  </g>

  <!-- Right Pure-Graphic Telemetry Pipeline (No Text) -->
  <g transform="translate(226, 150)">
    <!-- Branching Circuit Traces -->
    <path d="M-30 0 H14 M14 0 L42 -42 H178 M14 0 H178 M14 0 L42 42 H178 M178 -42 L202 0 M178 0 H202 M178 42 L202 0"
      stroke="#F05BEA" stroke-opacity="0.48" stroke-width="1.4" stroke-linecap="round" />

    <!-- Module 1: Top Electric Pink Bar -->
    <rect x="42" y="-56" width="136" height="28" rx="7" fill="#0A2323" fill-opacity="0.92" stroke="#F05BEA" stroke-opacity="0.58" stroke-width="1.2" />
    <circle cx="58" cy="-42" r="4.5" fill="#F05BEA" />
    <rect x="72" y="-45" width="64" height="6" rx="3" fill="#F05BEA" fill-opacity="0.45" />
    <rect x="142" y="-45" width="22" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.65" />

    <!-- Module 2: Center Translucent White Bar -->
    <rect x="42" y="-14" width="136" height="28" rx="7" fill="#0A2323" fill-opacity="0.92" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.2" />
    <circle cx="58" cy="0" r="4.5" fill="#FFFFFF" />
    <rect x="72" y="-3" width="46" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.48" />
    <rect x="124" y="-3" width="40" height="6" rx="3" fill="#F05BEA" fill-opacity="0.42" />

    <!-- Module 3: Bottom Neon Lime Bar -->
    <rect x="42" y="28" width="136" height="28" rx="7" fill="#0A2323" fill-opacity="0.92" stroke="#C8FF27" stroke-opacity="0.58" stroke-width="1.2" />
    <circle cx="58" cy="42" r="4.5" fill="#C8FF27" />
    <rect x="72" y="39" width="72" height="6" rx="3" fill="#C8FF27" fill-opacity="0.48" />
    <rect x="150" y="39" width="14" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.75" />

    <!-- Convergence Target Seal -->
    <circle cx="204" cy="0" r="11" fill="#071B1B" stroke="#C8FF27" stroke-width="1.6" />
    <circle cx="204" cy="0" r="4.5" fill="#C8FF27" />
  </g>
</svg>
