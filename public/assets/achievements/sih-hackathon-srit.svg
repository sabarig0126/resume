<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" fill="none">
  <defs>
    <linearGradient id="bg02" x1="0" y1="0" x2="480" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06122E" />
      <stop offset="52%" stop-color="#040A1E" />
      <stop offset="100%" stop-color="#0B1A3E" />
    </linearGradient>
    <radialGradient id="glow02" cx="35%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.3" />
      <stop offset="55%" stop-color="#2563EB" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#040A1E" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="amber02" cx="76%" cy="50%" r="36%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#040A1E" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rim02" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="55%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <pattern id="dots02" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#38BDF8" fill-opacity="0.16" />
    </pattern>
  </defs>

  <rect width="480" height="300" fill="url(#bg02)" />
  <rect width="480" height="300" fill="url(#dots02)" />
  <rect width="480" height="300" fill="url(#glow02)" />
  <rect width="480" height="300" fill="url(#amber02)" />

  <!-- Centered Pure-Geometric Circuit Hexagon & Architecture Pipeline -->
  <g transform="translate(148, 150)">
    <!-- Orbital Rings -->
    <circle cx="0" cy="0" r="78" stroke="#38BDF8" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="6 5" />
    <path d="M-56 -48 A74 74 0 0 1 56 -48" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
    <path d="M56 48 A74 74 0 0 1 -56 48" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" />

    <!-- Dual Hexagonal Frame -->
    <polygon points="0,-54 47,-27 47,27 0,54 -47,27 -47,-27" fill="#09193D" fill-opacity="0.92" stroke="url(#rim02)" stroke-width="2" />
    <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="#06122E" fill-opacity="0.65" stroke="#60A5FA" stroke-opacity="0.4" stroke-width="1.2" />

    <!-- Precision Innovation Gear & Spark Core -->
    <circle cx="0" cy="0" r="16" stroke="#22D3EE" stroke-width="1.8" />
    <path d="M0 -22V-16M0 16V22M-22 0H-16M16 0H22M-15.5 -15.5L-11 -11M11 11L15.5 15.5M15.5 -15.5L11 -11M-11 11L-15.5 15.5" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="0" cy="0" r="6" fill="#FBBF24" />
  </g>

  <!-- Right Pure-Graphic Telemetry Pipeline (No Text) -->
  <g transform="translate(226, 150)">
